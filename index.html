<body class="bg-gray-50 text-gray-800 font-sans pb-24">
    <div id="app"></div>

    <script>
        // ----------------------------------------------------
        // アプリケーションの全ロジック
        // ----------------------------------------------------
        const STORAGE_KEY = 'mpm_vanilla_v8_'; 

        const escapeHTML = (str) => {
            return String(str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        };

        const CAT_LABELS = {
            'loan': { label: 'ローン', icon: 'home', color: 'text-purple-600', bg: 'bg-purple-400', border: 'border-purple-200' },
            'fixed': { label: '固定費', icon: 'receipt_long', color: 'text-indigo-600', bg: 'bg-indigo-400', border: 'border-indigo-200' },
            'variable': { label: '変動費', icon: 'credit_card', color: 'text-rose-600', bg: 'bg-rose-400', border: 'border-rose-200' },
            'investment': { label: '投資', icon: 'trending_up', color: 'text-emerald-600', bg: 'bg-emerald-400', border: 'border-emerald-200' }
        };
        const SAFE_CAT = { label: '未分類', icon: 'payments', color: 'text-gray-600', bg: 'bg-gray-400', border: 'border-gray-200' };

        const ITEM_COLORS = [
            'bg-red-400', 'bg-orange-400', 'bg-amber-400', 'bg-yellow-400', 'bg-lime-400',
            'bg-green-400', 'bg-emerald-400', 'bg-teal-400', 'bg-cyan-400', 'bg-sky-400',
            'bg-blue-400', 'bg-indigo-400', 'bg-violet-400', 'bg-purple-400', 'bg-fuchsia-400',
            'bg-pink-400', 'bg-rose-400'
        ];

        const ICON_MAP = {
            'wallet': 'account_balance_wallet', 'arrow-down-to-line': 'vertical_align_bottom',
            'arrow-up-from-line': 'vertical_align_top', 'alert-circle': 'error_outline',
            'check-circle-2': 'check_circle', 'calculator': 'calculate', 'calendar': 'calendar_today',
            'chevron-down': 'expand_more', 'chevron-up': 'expand_less', 'bar-chart-3': 'bar_chart',
            'layout-dashboard': 'dashboard', 'save': 'save', 'info': 'info', 'building-2': 'account_balance',
            'alert-triangle': 'warning', 'x': 'close', 'settings': 'settings', 'copy': 'content_copy',
            'download': 'download', 'upload': 'upload', 'file-text': 'description', 'check': 'check',
            'plus': 'add', 'trash-2': 'delete', 'pencil': 'edit', 'message-square': 'chat_bubble_outline',
            'done': 'done_all', 'undo': 'undo', 'refresh': 'refresh', 'payments': 'payments',
            'home': 'home', 'receipt_long': 'receipt_long', 'credit_card': 'credit_card', 'trending_up': 'trending_up',
            'error_outline': 'error_outline', 'savings': 'savings', 'event_note': 'event_note',
            'auto_awesome': 'auto_awesome'
        };

        const App = {
            state: {
                activeTab: 'dashboard', dashTab: 'accounts',
                chartMode: 'all',
                accounts: [], wallets: [], incomes: [], payments: [], history: [], 
                specialPayments: [], memos: [],
                allocations: [], editAllocationId: null, 
                expandedPayIds: new Set(), editMode: null, deleteTarget: null,
                selectedAccountPopup: null, preSaveModal: null, showAutoSaveModal: false,
                confirmImportData: null, showSuccessModal: false, showBackupErrorModal: false,
                exportData: '', importData: '', importMsg: { text: '', isError: false }, copySuccess: false,
                saveMonthStr: '', manualHistoryMonth: '',
                selectedHistoryId: null, historyEditMode: null, tempHistoryEditData: null,
                confirmResetAllocations: false, confirmManualReset: false, confirmDeleteSubItem: null, alertMessage: null,
            },

            getIconHTML: function(name, size = 24, className = '') {
                const mappedName = ICON_MAP[name] || name;
                return `<span class="material-symbols-outlined ${className}" style="font-size: ${size}px; line-height: 1; display: inline-flex; align-items: center; justify-content: center;">${mappedName}</span>`;
            },

            getColorForName: function(name) {
                if (!name) return 'bg-gray-400';
                let hash = 0;
                for (let i = 0; i < name.length; i++) { hash = name.charCodeAt(i) + ((hash << 5) - hash); }
                hash = Math.abs(hash); return ITEM_COLORS[hash % ITEM_COLORS.length];
            },

            calcAmount: function(str) {
                if (str === null || str === undefined || str === '') return 0;
                if (typeof str === 'number') return str;
                try {
                    let sanitized = str.toString().replace(/[０-９＋－＊／．]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0)).replace(/\s+/g, '').replace(/[^0-9+\-*/.]/g, '');
                    if (!sanitized) return 0;
                    const tokens = sanitized.match(/[+\-*/]|[^+\-*/]+/g);
                    if (!tokens) return 0;
                    let stack = [], currentOp = '+';
                    for (let i = 0; i < tokens.length; i++) {
                        const token = tokens[i];
                        if (['+', '-', '*', '/'].includes(token)) { currentOp = token; } 
                        else {
                            let num = parseFloat(token) || 0;
                            if (currentOp === '+') stack.push(num); else if (currentOp === '-') stack.push(-num); else if (currentOp === '*') stack.push((stack.pop() || 0) * num); else if (currentOp === '/') stack.push(num !== 0 ? (stack.pop() || 0) / num : 0);
                        }
                    }
                    return Math.floor(stack.reduce((sum, val) => sum + val, 0));
                } catch (e) { return 0; }
            },

            formatCurrency: function(amountStr) {
                const num = App.calcAmount(amountStr);
                return new Intl.NumberFormat('ja-JP', { style: 'currency', currency: 'JPY' }).format(num);
            },

            getDisplayAmountHTML: function(str, className = "") {
                const num = App.calcAmount(str);
                const strVal = String(str || '');
                const hasMath = /[+\-*/]/.test(strVal.replace(/[＋－＊／]/g, '+'));
                return `<div class="flex flex-col items-end ${className}"><span class="font-bold">${App.formatCurrency(num)}</span>${hasMath ? `<span class="text-[10px] text-gray-400 font-mono -mt-1 tracking-tighter">(${escapeHTML(str)})</span>` : ''}</div>`;
            },

            getCurrentMonthStr: function() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; },
            getPreviousMonthStr: function() { const d = new Date(); d.setMonth(d.getMonth() - 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; },
            cleanInput: function(val) { return String(val || '').replace(/,/g, ''); },

            getNiceMax: function(val) {
                if (val <= 0) return 40000;
                const pow = Math.pow(10, Math.floor(Math.log10(val)));
                const frac = val / pow;
                let niceFrac;
                if (frac <= 1) niceFrac = 1; else if (frac <= 1.2) niceFrac = 1.2; else if (frac <= 1.6) niceFrac = 1.6;
                else if (frac <= 2) niceFrac = 2; else if (frac <= 4) niceFrac = 4; else if (frac <= 6) niceFrac = 6;
                else if (frac <= 8) niceFrac = 8; else niceFrac = 10;
                return niceFrac * pow;
            },

            safeLoadArray: function(keys) {
                for (let key of keys) {
                    try {
                        const data = localStorage.getItem(key);
                        if (data) {
                            const parsed = JSON.parse(data);
                            if (Array.isArray(parsed)) return parsed;
                        }
                    } catch(e) {}
                }
                return [];
            },

            loadData: function() {
                App.state.accounts = App.safeLoadArray([STORAGE_KEY + 'accounts', 'mpm_vanilla_v7_accounts']);
                App.state.wallets = App.safeLoadArray([STORAGE_KEY + 'wallets', 'mpm_vanilla_v7_wallets']);
                App.state.incomes = App.safeLoadArray([STORAGE_KEY + 'incomes', 'mpm_vanilla_v7_incomes']);
                
                const rawPayments = App.safeLoadArray([STORAGE_KEY + 'payments', 'mpm_vanilla_v7_payments']);
                App.state.payments = rawPayments.map(p => ({
                    ...p, category: p.category || (p.isFixed ? 'fixed' : 'variable'), 
                    subItems: (Array.isArray(p.subItems) ? p.subItems : []).map(s => ({...s, category: s.category || (s.isFixed ? 'fixed' : 'variable')}))
                }));
                
                App.state.history = App.safeLoadArray([STORAGE_KEY + 'history', 'mpm_vanilla_v7_history']);
                App.state.specialPayments = App.safeLoadArray([STORAGE_KEY + 'specialPayments', 'mpm_vanilla_v7_specialPayments']);
                App.state.memos = App.safeLoadArray([STORAGE_KEY + 'memos', 'mpm_vanilla_v7_memos']);
                
                // 割り振りデータのロード。古い形式（incomeIdがない）場合は互換性エラーを防ぐためクリア
                App.state.allocations = App.safeLoadArray([STORAGE_KEY + 'allocations']) || [];
                if (App.state.allocations.length > 0 && App.state.allocations[0].incomeId === undefined && App.state.allocations[0].sourceType === undefined) {
                    App.state.allocations = [];
                }

                // 入金のdefaultTargetマイグレーション
                App.state.incomes = App.state.incomes.map(i => {
                    let dt = i.defaultTarget;
                    if (dt === undefined && i.defaultAccountId) {
                        dt = 'account_' + i.defaultAccountId;
                    }
                    return { ...i, defaultTarget: dt || '' };
                });

                App.state.saveMonthStr = App.getCurrentMonthStr();
                App.state.manualHistoryMonth = App.getPreviousMonthStr();
            },

            saveData: function() {
                localStorage.setItem(STORAGE_KEY + 'accounts', JSON.stringify(App.state.accounts));
                localStorage.setItem(STORAGE_KEY + 'wallets', JSON.stringify(App.state.wallets));
                localStorage.setItem(STORAGE_KEY + 'incomes', JSON.stringify(App.state.incomes));
                localStorage.setItem(STORAGE_KEY + 'payments', JSON.stringify(App.state.payments));
                localStorage.setItem(STORAGE_KEY + 'history', JSON.stringify(App.state.history));
                localStorage.setItem(STORAGE_KEY + 'specialPayments', JSON.stringify(App.state.specialPayments));
                localStorage.setItem(STORAGE_KEY + 'memos', JSON.stringify(App.state.memos));
                localStorage.setItem(STORAGE_KEY + 'allocations', JSON.stringify(App.state.allocations));
            },

            totals: {},
            calculateTotals: function() {
                const s = App.state;
                let totalAccountsNum = 0, totalWalletsNum = 0;
                let activeTargetIncomes = 0, totalAccountIncomes = 0;
                let activeWalletsOutgo = 0;
                let activeIncomesList = 0, totalIncomesList = 0;
                let activePayments = 0, totalPaymentsNum = 0;
                let totalAccountShortage = 0; 
                
                const catTotals = { loan: 0, fixed: 0, variable: 0, investment: 0 };
                const allCatTotals = { loan: 0, fixed: 0, variable: 0, investment: 0 };

                s.accounts.forEach(a => {
                    const currentBal = App.calcAmount(a.amount);
                    totalAccountsNum += currentBal;
                    const inc = App.calcAmount(a.incomingAmount);
                    totalAccountIncomes += inc;
                    if (!a.isIncomingDone) activeTargetIncomes += inc;
                    
                    const relPays = s.payments.filter(p => p.accountId === a.id && !p.isDone);
                    const totalOut = relPays.reduce((sum, p) => sum + App.calcAmount(p.amount), 0);
                    if (currentBal - totalOut < 0) {
                        totalAccountShortage += Math.abs(currentBal - totalOut);
                    }
                });

                s.wallets.forEach(w => {
                    totalWalletsNum += App.calcAmount(w.amount);
                    if (!w.isOutgoDone) activeWalletsOutgo += App.calcAmount(w.outgoAmount);
                    if (!w.isIncomingDone) activeTargetIncomes += App.calcAmount(w.incomingAmount);
                });
                s.incomes.forEach(i => {
                    const amt = App.calcAmount(i.amount);
                    totalIncomesList += amt;
                    if (!i.isDone) activeIncomesList += amt;
                });
                s.payments.forEach(p => {
                    const pAmt = App.calcAmount(p.amount);
                    totalPaymentsNum += pAmt;
                    if (!p.isDone) activePayments += pAmt;
                    
                    let subTotal = 0;
                    if (p.subItems && p.subItems.length > 0) {
                        p.subItems.forEach(sub => {
                            const sAmt = App.calcAmount(sub.amount);
                            subTotal += sAmt;
                            const sCat = sub.category || 'variable';
                            if (!p.isDone && catTotals[sCat] !== undefined) catTotals[sCat] += sAmt;
                            if (allCatTotals[sCat] !== undefined) allCatTotals[sCat] += sAmt;
                        });
                    }
                    const diff = pAmt - subTotal;
                    if (diff > 0) {
                        const pCat = p.category || 'variable';
                        if (!p.isDone && catTotals[pCat] !== undefined) catTotals[pCat] += diff;
                        if (allCatTotals[pCat] !== undefined) allCatTotals[pCat] += diff;
                    }
                });

                const currentMonth = App.getCurrentMonthStr();
                let currentMonthSpecialAmt = 0;
                let totalSpecialAmt = 0;
                let totalMonthlyRequired = 0; 

                const curDate = new Date();
                const curY = curDate.getFullYear();
                const curM = curDate.getMonth() + 1;

                let upcomingSpecials = [];

                s.specialPayments.forEach(sp => {
                    if (!sp.isDone) {
                        const amt = App.calcAmount(sp.amount);
                        totalSpecialAmt += amt;
                        
                        if (sp.targetMonth === currentMonth) {
                            currentMonthSpecialAmt += amt;
                            activePayments += amt;
                        }

                        if (sp.targetMonth) {
                            const [ty, tm] = sp.targetMonth.split('-');
                            let monthsLeft = (parseInt(ty) - curY) * 12 + (parseInt(tm) - curM) + 1;
                            if (monthsLeft < 1) monthsLeft = 1;
                            upcomingSpecials.push({ amount: amt, monthsLeft: monthsLeft });
                        }
                    }
                });

                upcomingSpecials.sort((a, b) => a.monthsLeft - b.monthsLeft);
                let cumulativeAmt = 0;
                upcomingSpecials.forEach(sp => {
                    cumulativeAmt += sp.amount;
                    const required = Math.ceil(cumulativeAmt / sp.monthsLeft);
                    if (required > totalMonthlyRequired) {
                        totalMonthlyRequired = required;
                    }
                });

                const remainingIncomes = Math.max(0, activeIncomesList - activeTargetIncomes);
                // 確保している資金（口座＋現金＋未済入金）から、残りの支払い（未済引落＋未済消費＋特別支出当月分）を引く
                const activeFinalBalance = totalAccountsNum + totalWalletsNum + activeIncomesList - activePayments - activeWalletsOutgo;
                const calculatedEndBalance = totalAccountsNum + totalWalletsNum;

                App.totals = { 
                    totalAccountsNum, totalWalletsNum, activeTargetIncomes, totalAccountIncomes, 
                    activeWalletsOutgo, activeIncomesList, totalIncomesList, remainingIncomes, 
                    activePayments, totalPaymentsNum, catTotals, allCatTotals, activeFinalBalance, calculatedEndBalance,
                    totalSpecialAmt, totalMonthlyRequired, currentMonthSpecialAmt,
                    totalAccountShortage 
                };
            },

            executeAutoAllocation: function() {
                App.calculateTotals();
                let allocations = [];
                let availableSources = [];
                let shortages = {}; // key: 'type_id', value: fillAmount

                // 1. 各口座の不足額を計算
                App.state.accounts.forEach(acc => {
                    const relPays = App.state.payments.filter(p => p.accountId === acc.id && !p.isDone);
                    const totalOut = relPays.reduce((sum, p) => sum + App.calcAmount(p.amount), 0);
                    const expectedBal = App.calcAmount(acc.amount) - totalOut;

                    if (expectedBal < 0) {
                        shortages['account_' + acc.id] = Math.ceil(Math.abs(expectedBal) / 1000) * 1000;
                    } else if (expectedBal > 0) {
                        availableSources.push({ type: 'account', id: acc.id, remain: expectedBal });
                    }
                });

                // 2. 現金の不足額/余剰額
                App.state.wallets.forEach(w => {
                    const activeOut = w.isOutgoDone ? 0 : App.calcAmount(w.outgoAmount);
                    const expectedBal = App.calcAmount(w.amount) - activeOut;
                    if (expectedBal < 0) {
                        shortages['wallet_' + w.id] = Math.ceil(Math.abs(expectedBal) / 1000) * 1000;
                    } else if (expectedBal > 0) {
                        availableSources.push({ type: 'wallet', id: w.id, remain: expectedBal });
                    }
                });

                // 3. 入金ソース
                let availableIncomes = App.state.incomes.filter(i => !i.isDone).map(i => ({
                    type: 'income', id: i.id, remain: App.calcAmount(i.amount), defaultTarget: i.defaultTarget
                })).sort((a, b) => b.remain - a.remain); // 金額が大きい順

                availableSources = [...availableIncomes, ...availableSources];

                // a. 優先振込先がマイナスの場合、優先振込先設定されている入金から優先して埋める
                Object.keys(shortages).forEach(targetKey => {
                    if (shortages[targetKey] <= 0) return;

                    let targetingIncomes = availableSources.filter(src => src.type === 'income' && src.defaultTarget === targetKey && src.remain > 0);
                    
                    for (let src of targetingIncomes) {
                        if (shortages[targetKey] <= 0) break;
                        let allocAmt = Math.min(shortages[targetKey], src.remain);
                        if (allocAmt > 0) {
                            const [tType, tId] = targetKey.split('_');
                            allocations.push({
                                id: Date.now() + Math.random(),
                                sourceType: src.type, sourceId: src.id,
                                targetType: tType, targetId: Number(tId),
                                amount: String(allocAmt),
                                isDefault: true
                            });
                            src.remain -= allocAmt;
                            shortages[targetKey] -= allocAmt;
                        }
                    }
                });

                // b. まだマイナスのターゲットがあれば、他のソースから埋める
                Object.keys(shortages).forEach(targetKey => {
                    if (shortages[targetKey] <= 0) return;

                    const [tType, tId] = targetKey.split('_');
                    
                    for (let src of availableSources) {
                        if (shortages[targetKey] <= 0) break;
                        if (src.remain <= 0) continue;
                        if (src.type === tType && src.id === Number(tId)) continue; // 自分自身からは補填しない

                        let allocAmt = Math.min(shortages[targetKey], src.remain);
                        if (allocAmt > 0) {
                            allocations.push({
                                id: Date.now() + Math.random(),
                                sourceType: src.type, sourceId: src.id,
                                targetType: tType, targetId: Number(tId),
                                amount: String(allocAmt),
                                isDefault: false
                            });
                            src.remain -= allocAmt;
                            shortages[targetKey] -= allocAmt;
                        }
                    }
                });

                // c. プラス(remain > 0)になっている入金で、優先振込先が設定されているものは全額割り振る
                for (let src of availableSources) {
                    if (src.type === 'income' && src.remain > 0 && src.defaultTarget) {
                        const [tType, tId] = src.defaultTarget.split('_');
                        const targetExists = tType === 'account' ? App.state.accounts.some(a=>a.id===Number(tId)) : App.state.wallets.some(w=>w.id===Number(tId));
                        if (targetExists) {
                            allocations.push({
                                id: Date.now() + Math.random(),
                                sourceType: src.type, sourceId: src.id,
                                targetType: tType, targetId: Number(tId),
                                amount: String(src.remain),
                                isDefault: true
                            });
                            src.remain = 0;
                        }
                    }
                }

                App.state.allocations = allocations;
                App.syncAllocationsToAccounts();
                App.saveData();
                App.render();
            },
            
            syncAllocationsToAccounts: function() {
                App.state.accounts.forEach(a => {
                    const accAllocs = App.state.allocations.filter(al => al.targetType === 'account' && al.targetId === a.id);
                    if (accAllocs.length > 0) {
                        const sum = accAllocs.reduce((s, al) => s + App.calcAmount(al.amount), 0);
                        a.incomingAmount = String(sum);
                    } else {
                        a.incomingAmount = ''; 
                    }
                });
                App.state.wallets.forEach(w => {
                    const walAllocs = App.state.allocations.filter(al => al.targetType === 'wallet' && al.targetId === w.id);
                    if (walAllocs.length > 0) {
                        const sum = walAllocs.reduce((s, al) => s + App.calcAmount(al.amount), 0);
                        w.incomingAmount = String(sum);
                    } else {
                        w.incomingAmount = ''; 
                    }
                });
            },

            requestResetAllocations: function() {
                App.state.confirmResetAllocations = true;
                App.render();
            },

            executeResetAllocations: function() {
                App.state.allocations = [];
                App.syncAllocationsToAccounts();
                App.saveData();
                App.state.confirmResetAllocations = false;
                App.render();
            },

            addAllocation: function(sourceType, sourceId) {
                if (App.state.accounts.length === 0 && App.state.wallets.length === 0) {
                    App.showAlert('先に「口座と現金」タブから口座を登録してください。'); return;
                }
                const newId = Date.now() + Math.random();
                const targetType = App.state.accounts.length > 0 ? 'account' : 'wallet';
                const targetId = App.state.accounts.length > 0 ? App.state.accounts[0].id : App.state.wallets[0].id;
                App.state.allocations.push({
                    id: newId, sourceType: sourceType, sourceId: sourceId, 
                    targetType: targetType, targetId: targetId, amount: ""
                });
                App.state.editAllocationId = newId;
                App.render();
            },
            
            startEditAllocation: function(id) { App.state.editAllocationId = id; App.render(); },
            
            saveEditAllocation: function(e, allocId, sourceType, sourceId) {
                e.preventDefault();
                const valStr = e.target.amount.value;
                const valNum = App.calcAmount(valStr);
                const targetVal = e.target.target.value; // 'account_123' or 'wallet_456'
                if (!targetVal) return;
                const [targetType, tIdStr] = targetVal.split('_');
                const targetId = Number(tIdStr);
                
                let sourceLimit = 0;
                if (sourceType === 'income') {
                    const income = App.state.incomes.find(i => i.id === sourceId);
                    if (income) sourceLimit = App.calcAmount(income.amount);
                } else if (sourceType === 'account') {
                    const acc = App.state.accounts.find(a => a.id === sourceId);
                    if (acc) {
                        const relPays = App.state.payments.filter(p => p.accountId === acc.id && !p.isDone);
                        const totalOut = relPays.reduce((sum, p) => sum + App.calcAmount(p.amount), 0);
                        sourceLimit = App.calcAmount(acc.amount) - totalOut;
                    }
                } else if (sourceType === 'wallet') {
                    const wal = App.state.wallets.find(w => w.id === sourceId);
                    if (wal) {
                        sourceLimit = App.calcAmount(wal.amount) - (wal.isOutgoDone ? 0 : App.calcAmount(wal.outgoAmount));
                    }
                }

                const otherAllocs = App.state.allocations.filter(a => a.sourceType === sourceType && a.sourceId === sourceId && a.id !== allocId);
                const otherSum = otherAllocs.reduce((s, a) => s + App.calcAmount(a.amount), 0);
                
                if (otherSum + valNum > sourceLimit) {
                    App.showAlert('エラー：割り振り可能額 (' + App.formatCurrency(sourceLimit) + ') を超過しています！\n金額を減らすか、他の割り振りを削除してください。');
                    return;
                }

                App.state.allocations = App.state.allocations.map(a => a.id === allocId ? { ...a, targetType: targetType, targetId: targetId, amount: valStr, isDefault: false } : a);
                App.state.editAllocationId = null;
                App.syncAllocationsToAccounts();
                App.saveData();
                App.render();
            },
            
            deleteAllocation: function(id) {
                App.state.allocations = App.state.allocations.filter(a => a.id !== id);
                App.syncAllocationsToAccounts();
                App.saveData();
                App.render();
            },

            createHistoryDetails: function() {
                let details = { loan: [], fixed: [], variable: [], investment: [] };
                App.state.payments.forEach(p => {
                    let subTotal = 0;
                    if (p.subItems && p.subItems.length > 0) {
                        p.subItems.forEach(sub => {
                            const amt = App.calcAmount(sub.amount);
                            const cat = sub.category || 'variable';
                            if (details[cat] && amt > 0) details[cat].push({ id: 'd_' + Date.now() + Math.random().toString(), name: sub.name, amount: amt });
                            subTotal += amt;
                        });
                    }
                    const diff = App.calcAmount(p.amount) - subTotal;
                    if (diff > 0) {
                        const cat = p.category || 'variable';
                        if (details[cat]) details[cat].push({ id: 'd_' + Date.now() + Math.random().toString(), name: p.name, amount: diff });
                    }
                });
                
                const currentMonth = App.getCurrentMonthStr();
                App.state.specialPayments.forEach(sp => {
                    if (!sp.isDone && sp.targetMonth === currentMonth) {
                        const amt = App.calcAmount(sp.amount);
                        if (amt > 0) {
                            details['fixed'].push({ id: 'd_sp_' + Date.now() + Math.random().toString(), name: '[特別] ' + sp.name, amount: amt });
                        }
                    }
                });
                return details;
            },

            createIncomeDetails: function() {
                let details = [];
                App.state.incomes.forEach(i => {
                    const amt = App.calcAmount(i.amount);
                    if (amt > 0) details.push({ id: 'i_' + Date.now() + Math.random().toString(), name: i.name, amount: amt });
                });
                return details;
            },

            moveItem: function(type, index, direction, e) { if (e) e.stopPropagation(); let list = App.state[type]; const newIndex = index + direction; if (newIndex < 0 || newIndex >= list.length) return; [list[index], list[newIndex]] = [list[newIndex], list[index]]; App.saveData(); App.render(); },
            requestDelete: function(type, id, name, e) { if (e) e.stopPropagation(); App.state.deleteTarget = { type, id, name }; App.render(); },

                else if (t.type === 'subItem') { App.state.payments = App.state.payments.map(p => ({ ...p, subItems: (p.subItems||[]).filter(s => s.id !== t.id) })); } 
                else if (t.type === 'history') { App.state.history = App.state.history.filter(item => item.id !== t.id); App.state.selectedHistoryId = null; App.state.historyEditMode = null; }
                else if (t.type === 'specialPayment') { App.state.specialPayments = App.state.specialPayments.filter(item => item.id !== t.id); }
                else if (t.type === 'memo') { App.state.memos = App.state.memos.filter(item => item.id !== t.id); }
                else { App.state[t.type + 's'] = App.state[t.type + 's'].filter(item => item.id !== t.id); }

            saveEdit: function(e, type, id, paymentId) {
                e.preventDefault(); const form = e.target;
                if (type === 'account') {
                    App.state.accounts = App.state.accounts.map(a => a.id === id ? { ...a, name: form.name.value, amount: App.cleanInput(form.amount.value), memo: form.memo ? form.memo.value : '' } : a);
                }
                else if (type === 'wallet') App.state.wallets = App.state.wallets.map(w => w.id === id ? { ...w, name: form.name.value, amount: App.cleanInput(form.amount.value), outgoAmount: form.outgoAmount ? App.cleanInput(form.outgoAmount.value) : w.outgoAmount, isOutgoFixed: form.isOutgoFixed ? form.isOutgoFixed.checked : w.isOutgoFixed, memo: form.memo ? form.memo.value : '' } : w);
                else if (type === 'income') App.state.incomes = App.state.incomes.map(i => i.id === id ? { ...i, name: form.name.value, amount: App.cleanInput(form.amount.value), defaultTarget: form.defaultTarget.value, isFixed: form.isFixed ? form.isFixed.checked : i.isFixed, memo: form.memo ? form.memo.value : '' } : i);
                else if (type === 'payment') App.state.payments = App.state.payments.map(p => p.id === id ? { ...p, name: form.name.value, amount: App.cleanInput(form.amount.value), dueDate: form.dueDate.value ? Number(form.dueDate.value) : null, endDate: form.endDate ? form.endDate.value : '', accountId: form.accountId.value ? Number(form.accountId.value) : '', category: form.category.value, memo: form.memo ? form.memo.value : '' } : p);
                else if (type === 'subItem') App.state.payments = App.state.payments.map(p => { if (p.id === paymentId) { return { ...p, subItems: p.subItems.map(s => s.id === id ? { ...s, name: form.name.value, amount: App.cleanInput(form.amount.value), category: form.category.value, endDate: form.endDate ? form.endDate.value : '', memo: form.memo ? form.memo.value : '' } : s) }; } return p; });
                else if (type === 'special') App.state.specialPayments = App.state.specialPayments.map(sp => sp.id === id ? { ...sp, name: form.name.value, amount: App.cleanInput(form.amount.value), targetMonth: form.targetMonth.value, memo: form.memo ? form.memo.value : '' } : sp);
                else if (type === 'memo') { App.state.memos = App.state.memos.map(m => m.id === id ? { ...m, title: form.title.value, targetDate: form.targetDate.value, content: form.content.value } : m); App.state.memos.sort((a,b)=>new Date(a.targetDate) - new Date(b.targetDate)); }

                App.state.payments.forEach(p => { p.amount = p.category === 'variable' ? '' : p.amount; p.isDone = false; if (p.subItems) p.subItems.forEach(s => { s.amount = s.category === 'variable' ? '' : s.amount; }); });

                    App.showAlert('月を選択してください。');
                    return;
                }
                const [y, m] = targetMonth.split('-');
                const label = `${y.slice(2)}年${parseInt(m, 10)}月`;

            confirmSaveHistory: function() {
                const modal = App.state.preSaveModal;
                const incomeInput = document.getElementById('pre-save-income').value;
                const paymentInput = document.getElementById('pre-save-payment').value;
                const balanceInput = document.getElementById('pre-save-balance').value;

                const newHistory = {
                    id: modal.id,
                    label: modal.label,
                    income: Number(incomeInput),
                    payment: Number(paymentInput),
                    balance: Number(balanceInput),

                    incomeDetails: App.createIncomeDetails()
                };

                const existingIndex = App.state.history.findIndex(h => h.id === modal.id);

                    App.state.history.push(newHistory);

                App.saveData();

            generateExportText: function() {
                const exportObj = {
                    accounts: App.state.accounts, wallets: App.state.wallets, incomes: App.state.incomes,
                    payments: App.state.payments, history: App.state.history, specialPayments: App.state.specialPayments,
                    memos: App.state.memos, allocations: App.state.allocations
                };
                return JSON.stringify(exportObj, null, 2);
            },
            handleDownloadExport: function() {
                const text = App.generateExportText();
                const blob = new Blob([text], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; 
                a.download = `支払管理バックアップ_${new Date().toISOString().slice(0, 10)}.txt`;
                document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
            },
            handleGenerateExport: function() {
                App.state.exportData = App.generateExportText();
                App.state.copySuccess = false;
                App.render();
            },
            handleCopy: function() {
                if (!App.state.exportData) return;
                try {
                    const textArea = document.createElement("textarea");
                    textArea.value = App.state.exportData;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand("copy");
                    document.body.removeChild(textArea);
                    App.state.copySuccess = true;
                    App.render();
                    setTimeout(() => { App.state.copySuccess = false; App.render(); }, 2000);
                } catch (e) {
                    App.showAlert("コピーに失敗しました。テキストエリアを選択して手動でコピーしてください。");
                }
            },
            handleFileUpload: function(input) {
                const file = input.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(e) { App.state.importData = e.target.result; App.render(); };
                reader.readAsText(file);
            },
            handleImportClick: function() {
                if (!App.state.importData || App.state.importData.trim() === '') {
                    App.state.importMsg = { text: 'データが入力されていません。', isError: true };
                    App.render(); return;
                }
                try {
                    JSON.parse(App.state.importData);
                    App.state.importMsg = { text: '', isError: false };
                    App.state.confirmImportData = true;
                    App.render();
                } catch (e) {
                    App.state.importMsg = { text: 'データの形式が正しくありません。(JSONパースエラー)', isError: true };
                    App.render();
                }
            },
            executeImport: function() {
                try {
                    const data = JSON.parse(App.state.importData);
                    if(data.accounts) App.state.accounts = data.accounts;
                    if(data.wallets) App.state.wallets = data.wallets;
                    if(data.incomes) App.state.incomes = data.incomes;
                    if(data.payments) App.state.payments = data.payments;
                    if(data.history) App.state.history = data.history;
                    if(data.specialPayments) App.state.specialPayments = data.specialPayments;
                    if(data.memos) App.state.memos = data.memos;
                    if(data.allocations) App.state.allocations = data.allocations;
                    
                    App.saveData();
                    App.state.confirmImportData = null; App.state.importData = ''; App.state.importMsg = { text: '', isError: false };
                    App.state.showSuccessModal = true; App.render();
                } catch(e) {
                    App.state.confirmImportData = null;
                    App.state.importMsg = { text: '復元中にエラーが発生しました。', isError: true };
                    App.render();
                }
            },

                    const rawMax = Math.max(...s.history.map(h => Math.max(Number(h.payment)||0, Number(h.balance)||0, Number(h.income)||0)), 1);
                    const maxVal = App.getNiceMax(rawMax);
                    const yAxisValues = [1, 0.75, 0.5, 0.25, 0].map(ratio => maxVal * ratio);
                    const len = s.history.length;

                    let svgLines = '';
                    for (let i = 0; i < len - 1; i++) {
                        const h1 = s.history[i]; const h2 = s.history[i+1];
                        const x1 = ((i + 0.5) / len) * 100; const x2 = ((i + 1.5) / len) * 100;
                        const yBal1 = Math.max(Math.min((h1.balance / maxVal) * 100, 100), 0);
                        const yBal2 = Math.max(Math.min((h2.balance / maxVal) * 100, 100), 0);
                        svgLines += `<line x1="${x1}%" y1="${100 - yBal1}%" x2="${x2}%" y2="${100 - yBal2}%" stroke="#10b981" stroke-width="2" stroke-dasharray="4 4" />`;
                        
                        if (s.chartMode === 'pay_cat' || s.chartMode === 'pay_item') {

                        } else if (s.chartMode === 'inc_item') {
                            const yInc1 = Math.min(((h1.income||0) / maxVal) * 100, 100); const yInc2 = Math.min(((h2.income||0) / maxVal) * 100, 100);
                            svgLines += `<line x1="${x1}%" y1="${100 - yInc1}%" x2="${x2}%" y2="${100 - yInc2}%" stroke="#34d399" stroke-width="2" stroke-dasharray="4 4" opacity="0.5" />`;
                        }
                    }
                    
                    html += `<div class="relative h-[250px] mt-2 flex">`;
                    html += `<div class="w-16 shrink-0 flex flex-col justify-between items-end pr-2 pb-8 text-[10px] text-gray-400 font-mono z-10 bg-white border-r border-gray-100">${yAxisValues.map(val => `<span>${val === 0 ? '0' : App.formatCurrency(val).replace('￥', '¥').replace('.00', '')}</span>`).join('')}</div>`;
                    html += `<div class="flex-1 overflow-x-auto hide-scrollbar relative border-b-2 border-gray-200 pb-8"><div class="absolute inset-0 flex flex-col justify-between pointer-events-none z-0 pb-8 px-2 min-w-full">${[1, 2, 3, 4, 5].map(() => `<div class="w-full border-t border-gray-200 border-dashed"></div>`).join('')}</div><div class="flex items-end justify-around gap-6 h-full px-4 min-w-max relative z-10"><svg class="absolute inset-0 w-full h-full pointer-events-none z-0 overflow-visible" preserveAspectRatio="none">${svgLines}</svg>`;
                    
                    s.history.forEach((data, i) => {
                        const isSelected = s.selectedHistoryId === data.id;
                        const paymentValue = Number(data.payment) || 0;
                        const balanceValue = Number(data.balance) || 0;
                        const incomeValue = Number(data.income) || 0;
                        const paymentHeight = (paymentValue / maxVal) * 100;
                        const incomeHeight = (incomeValue / maxVal) * 100;
                        const isShort = balanceValue < 0;
                        
                        let incBarsHTML = '';
                        const incDetails = data.incomeDetails || (incomeValue > 0 ? [{name: '過去の収入', amount: incomeValue}] : []);
                        if (s.chartMode === 'all') {
                            incBarsHTML = `<div class="w-full h-full bg-emerald-300 rounded-t-[2px]"></div>`;

                            if (incDetails.length === 0) {
                                incBarsHTML = `<div class="w-full h-full bg-emerald-300 rounded-t-[2px]"></div>`;
                            } else {
                                incDetails.forEach(d => {

                                    const color = App.getColorForName(d.name);
                                    incBarsHTML += `<div style="height: ${h}%;" class="${color} w-full rounded-t-[1px]"></div>`;
                                });
                            }
                        }

                        let payBarsCatHTML = '';
                        if (data.catTotals && paymentValue > 0) {
                            const c = data.catTotals;
                            const totalCat = (c.loan||0) + (c.fixed||0) + (c.variable||0) + (c.investment||0);
                            if (totalCat === 0) {
                                payBarsCatHTML = `<div class="w-full h-full bg-rose-400 rounded-t-[2px]"></div>`;
                            } else {
                                const pLoan = ((c.loan||0) / totalCat) * 100; const pFixed = ((c.fixed||0) / totalCat) * 100; const pVar = ((c.variable||0) / totalCat) * 100; const pInv = ((c.investment||0) / totalCat) * 100;
                                payBarsCatHTML += pInv > 0 ? `<div style="height: ${pInv}%;" class="bg-emerald-400 w-full rounded-t-[1px]"></div>` : '';
                                payBarsCatHTML += pVar > 0 ? `<div style="height: ${pVar}%;" class="bg-rose-400 w-full rounded-t-[1px]"></div>` : '';
                                payBarsCatHTML += pFixed > 0 ? `<div style="height: ${pFixed}%;" class="bg-indigo-400 w-full rounded-t-[1px]"></div>` : '';
                                payBarsCatHTML += pLoan > 0 ? `<div style="height: ${pLoan}%;" class="bg-purple-400 w-full rounded-t-[1px]"></div>` : '';
                            }
                        } else {
                            payBarsCatHTML = `<div class="w-full h-full bg-rose-400 rounded-t-[2px]"></div>`;
                        }

                        let payBarsItemHTML = '';
                        let payItemsMap = {};
                        if (data.details) {
                            Object.keys(data.details).forEach(cat => {
                                data.details[cat].forEach(d => {
                                    if(!payItemsMap[d.name]) payItemsMap[d.name] = 0;
                                    payItemsMap[d.name] += d.amount;
                                });
                            });
                        } else if (paymentValue > 0) {
                            payItemsMap['過去の支払い'] = paymentValue;
                        }
                        const payItemNames = Object.keys(payItemsMap);
                        if (payItemNames.length === 0) {
                            payBarsItemHTML = `<div class="w-full h-full bg-rose-400 rounded-t-[2px]"></div>`;
                        } else {
                            payItemNames.forEach(name => {
                                const h = (payItemsMap[name] / paymentValue) * 100;
                                const color = App.getColorForName(name);
                                payBarsItemHTML += `<div style="height: ${h}%;" class="${color} w-full rounded-t-[1px]"></div>`;
                            });
                        }

                        let visibleBars = '';
                        if (s.chartMode === 'all') {
                            visibleBars = `
                                <div class="flex items-end justify-center gap-1 w-full h-full relative z-10">
                                    <div class="w-3.5 flex flex-col justify-end transition-all duration-500 rounded-t-sm overflow-hidden" style="height: ${incomeHeight}%;">${incBarsHTML}</div>
                                    <div class="w-3.5 flex flex-col justify-end transition-all duration-500 rounded-t-sm overflow-hidden" style="height: ${paymentHeight}%;">${payBarsCatHTML}</div>

                        html += `

                                        ${visibleBars}
                                        <div class="absolute w-10 h-1 z-30 ${isShort ? 'bg-red-500' : 'bg-emerald-500'} rounded-full shadow-sm" style="bottom: ${Math.max(Math.min((balanceValue / maxVal) * 100, 100), -2)}%; left:50%; transform:translateX(-50%);"></div>
                                    </div>
                                    <span class="text-[10px] ${isSelected ? 'text-indigo-600 font-black' : 'text-gray-500 font-bold'} mt-2 whitespace-nowrap absolute -bottom-6">${escapeHTML(data.label)}</span>
                                </div>
                        `;
                    });
                    
                    html += `</div></div></div>`;
                }
                
                let legendHTML = '';
                if (s.chartMode === 'all') {
                    legendHTML = `
                        <span class="flex items-center gap-1"><div class="w-2.5 h-2.5 bg-emerald-300 rounded-sm"></div>収入合計</span>
                        <span class="flex items-center gap-1"><div class="w-2.5 h-2.5 bg-purple-400 rounded-sm"></div>ローン</span>
                        <span class="flex items-center gap-1"><div class="w-2.5 h-2.5 bg-indigo-400 rounded-sm"></div>固定費</span>
                        <span class="flex items-center gap-1"><div class="w-2.5 h-2.5 bg-rose-400 rounded-sm"></div>変動費</span>
                        <span class="flex items-center gap-1"><div class="w-2.5 h-2.5 bg-emerald-400 rounded-sm"></div>投資</span>
                    `;
                } else if (s.chartMode === 'pay_cat') {
                    legendHTML = `
                        <span class="flex items-center gap-1"><div class="w-2.5 h-2.5 bg-purple-400 rounded-sm"></div>ローン</span>

                        <span class="flex items-center gap-1"><div class="w-2.5 h-2.5 bg-emerald-400 rounded-sm"></div>投資</span>
                    `;
                } else if (s.chartMode === 'pay_item' || s.chartMode === 'inc_item') {
                    legendHTML = `<span class="text-gray-500 font-bold">※項目名ごとに自動で色が割り当てられています</span>`;
                }

                html += `
                            <div class="flex justify-center gap-4 mt-6 text-[10px] sm:text-xs text-gray-600 flex-wrap">
                                ${legendHTML}
                                <span class="flex items-center gap-1 ml-4"><div class="w-4 h-1 border-t-2 border-dashed border-emerald-500"></div>残高の推移</span>
                            </div>
                        </div>
                `;

                if (s.selectedHistoryId) {
                    const sel = s.history.find(h => h.id === s.selectedHistoryId);
                    if (sel) {
                        html += `<div class="bg-white rounded-2xl p-6 shadow-lg border border-indigo-200 animate-fade-in mt-6">`;
                        
                        if (s.historyEditMode === sel.id) {
                            const temp = s.tempHistoryEditData;
                            html += `
                                <div class="flex items-center justify-between mb-4 border-b pb-3">
                                    <h3 class="text-lg font-black text-indigo-800">${escapeHTML(temp.label)} の内訳を修正</h3>
                                    <button onclick="App.cancelHistoryEdit()" class="text-gray-400 hover:text-gray-700">${App.getIconHTML('x', 24)}</button>
                                </div>
                                <form onsubmit="App.saveHistoryEdit(event, '${temp.id}')" class="space-y-4">
                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        <div class="bg-blue-50 p-4 rounded-xl border border-blue-100">
                                            <label class="text-sm font-bold text-blue-800 block mb-1">総入金・収入 (円)</label>
                                            <input type="number" id="edit-hist-income" value="${temp.income||0}" onchange="App.updateTempHistoryIncome(this.value)" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-300 bg-white" required />
                                        </div>
                                        <div class="${temp.balance < 0 ? 'bg-red-50 border-red-200' : 'bg-emerald-50 border-emerald-200'} p-4 rounded-xl border">
                                            <label class="text-sm font-bold ${temp.balance < 0 ? 'text-red-800' : 'text-emerald-800'} block mb-1">月末残高 (円)</label>
                                            <input type="number" id="edit-hist-balance" value="${temp.balance}" onchange="App.updateTempHistoryBalance(this.value)" class="w-full px-3 py-2 border rounded-lg bg-white" required />
                                        </div>
                                    </div>
                                    <div class="mt-4 pt-2 border-t border-gray-100">
                                        <p class="text-sm font-bold text-gray-700 mb-3">各明細を修正 (自動で総額が再計算されます)</p>
                            `;
                            
                            if (temp.incomeDetails && temp.incomeDetails.length > 0) {
                                html += `<div class="mb-4 bg-blue-50/50 rounded-xl p-3 border border-blue-100"><div class="font-bold text-blue-700 mb-2 border-b border-blue-200 pb-2">入金・収入の内訳</div><div class="space-y-2 pl-2">`;
                                temp.incomeDetails.forEach(i => {
                                    html += `<div class="flex justify-between items-center gap-2"><span class="text-sm text-gray-600 flex-1 truncate">${escapeHTML(i.name)}</span><input type="number" value="${i.amount}" onchange="App.updateTempHistoryIncomeDetail('${i.id}', this.value)" class="w-24 px-2 py-1 text-sm border rounded bg-white shadow-sm" /></div>`;
                                });
                                html += `</div></div>`;
                            }

                            Object.keys(CAT_LABELS).forEach(cat => {
                                const items = temp.details[cat];
                                if (items && items.length > 0) {
                                    html += `<div class="mb-4 bg-gray-50 rounded-xl p-3 border border-gray-200"><div class="flex justify-between items-center font-bold ${CAT_LABELS[cat].color} mb-2 border-b border-gray-200 pb-2"><span class="flex items-center gap-1.5"><span class="w-3 h-3 ${CAT_LABELS[cat].bg} rounded-sm"></span>${CAT_LABELS[cat].label}</span><span>計: ${App.formatCurrency(temp.catTotals[cat])}</span></div><div class="space-y-2 pl-2">`;
                                    items.forEach(i => {
                                        html += `<div class="flex justify-between items-center gap-2"><span class="text-sm text-gray-600 flex-1 truncate">${escapeHTML(i.name)}</span><input type="number" value="${i.amount}" onchange="App.updateTempHistoryDetail('${cat}', '${i.id}', this.value)" class="w-24 px-2 py-1 text-sm border rounded bg-white shadow-sm" /></div>`;
                                    });
                                    html += `</div></div>`;
                                }
                            });

                            html += `
                                    </div>
                                    <div class="flex justify-end gap-3 mt-4 pt-4 border-t border-gray-200">
                                        <div class="flex-1 text-left flex flex-col justify-center"><span class="text-xs text-gray-500">修正後の総支払</span><span class="font-black text-lg text-rose-700">${App.formatCurrency(temp.payment)}</span></div>
                                        <button type="button" onclick="App.cancelHistoryEdit()" class="px-4 py-2.5 bg-white border border-gray-300 text-gray-700 font-bold rounded-lg hover:bg-gray-50">キャンセル</button>
                                        <button type="submit" class="px-6 py-2.5 bg-indigo-600 text-white font-bold rounded-lg shadow hover:bg-indigo-700">保存して完了</button>
                                    </div>
                                </form>
                            `;
                        } else {
                            html += `
                                <div class="flex items-center justify-between mb-6">
                                    <h3 class="text-xl font-black text-indigo-900 border-l-4 border-indigo-500 pl-3">${escapeHTML(sel.label)} の詳細</h3>

                                    <div class="bg-blue-50 rounded-xl p-5 border border-blue-100 flex flex-col justify-start">
                                        <p class="text-sm text-blue-700 font-bold mb-1">総入金・収入</p>
                                        <p class="text-3xl font-black text-blue-900 mb-4">${App.formatCurrency(sel.income||0)}</p>
                            `;
                            
                            if (sel.incomeDetails && sel.incomeDetails.length > 0) {
                                html += `<ul class="text-xs text-gray-600 space-y-1 border-t border-blue-200 pt-3">`;
                                sel.incomeDetails.forEach(i => { html += `<li class="flex justify-between items-center"><div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-sm ${App.getColorForName(i.name)}"></span><span class="truncate">${escapeHTML(i.name)}</span></div><span class="font-bold">${App.formatCurrency(i.amount)}</span></li>`; });

                            html += `</div>
                                    <div class="bg-gray-50 rounded-xl p-5 border border-gray-100 flex flex-col justify-start">

                                    const items = sel.details[cat];

                                        const catTot = sel.catTotals ? sel.catTotals[cat] : items.reduce((s, i) => s + App.calcAmount(i.amount), 0);

                            `;
                        }
                        html += `</div>`;

                } else {
                    html += `

                                    ${App.state.exportData ? `
                                        <div class="relative animate-fade-in">
                                            <textarea readonly class="w-full h-40 p-3 text-xs font-mono bg-white border border-blue-200 rounded-lg outline-none resize-none shadow-inner text-gray-700 whitespace-pre">${escapeHTML(App.state.exportData)}</textarea>
                                            <button onclick="App.handleCopy()" class="absolute top-2 right-2 p-2 rounded-md font-bold text-xs flex items-center gap-1 transition-all ${App.state.copySuccess ? 'bg-emerald-500 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200 border border-gray-300'}">
                                                ${App.state.copySuccess ? `${App.getIconHTML('check', 16)} 完了` : `${App.getIconHTML('copy', 16)} コピー`}
                                            </button>
                                        </div>
                                    ` : ''}
                                </div>
                                <div class="bg-emerald-50/50 p-5 rounded-xl border border-emerald-100 flex flex-col">
                                    <h3 class="text-lg font-bold text-emerald-800 mb-2 flex items-center gap-2">${App.getIconHTML('upload', 24)} データの復元</h3>
                                    <p class="text-sm text-gray-600 mb-4">保存したテキストファイルを読み込むか、枠内にテキストを貼り付けて復元します。</p>
                                    <div class="mb-4">
                                        <label class="flex flex-col sm:flex-row items-center justify-center gap-2 w-full bg-white border-2 border-dashed border-emerald-400 rounded-lg p-4 cursor-pointer hover:bg-emerald-50 transition-colors">
                                            ${App.getIconHTML('file-text', 28, 'text-emerald-500')}
                                            <span class="text-sm font-bold text-emerald-700 text-center">ファイルを選択して読込</span>
                                            <input type="file" accept=".txt" class="hidden" onchange="App.handleFileUpload(this)" />
                                        </label>
                                    </div>
                                    <div class="flex items-center gap-4 mb-4"><div class="flex-1 h-px bg-emerald-200"></div><span class="text-xs text-emerald-600 font-bold">または</span><div class="flex-1 h-px bg-emerald-200"></div></div>
                                    <textarea id="import-data-text" oninput="App.state.importData=this.value" placeholder="ここにバックアップテキストを貼り付け" class="w-full h-24 p-3 text-xs font-mono bg-white border border-emerald-200 rounded-lg outline-none resize-y shadow-inner mb-4">${escapeHTML(App.state.importData)}</textarea>
                                    <div class="flex flex-col gap-3 mt-auto">
                                        ${App.state.importMsg.text ? `
                                            <div class="p-3 rounded-lg text-sm font-bold flex items-start gap-2 animate-fade-in ${App.state.importMsg.isError ? 'bg-red-100 text-red-700 border border-red-200' : 'bg-emerald-100 text-emerald-800 border border-emerald-200'}">
                                                ${App.getIconHTML(App.state.importMsg.isError ? 'alert-triangle' : 'check-circle-2', 20)}
                                                <span>${escapeHTML(App.state.importMsg.text)}</span>
                                            </div>
                                        ` : ''}
                                        <button onclick="App.handleImportClick()" class="w-full bg-emerald-600 hover:bg-emerald-700 disabled:bg-gray-300 text-white font-bold py-3 px-6 rounded-lg text-sm flex items-center justify-center gap-2 shadow-sm">
                                            ${App.getIconHTML('upload', 20)} 復元を実行する
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            },

            renderModals: function() {
                let html = '';
                const s = App.state;

                if (s.showBackupErrorModal) {
                    html += `
                        <div class="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-[100] p-4 animate-fade-in">
                            <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl text-center animate-zoom-in">
                                <div class="flex justify-center mb-4 text-red-500">${App.getIconHTML('error_outline', 40)}</div>
                                <h3 class="text-xl font-bold text-gray-800 mb-2">バックアップ失敗</h3>
                                <p class="text-sm text-gray-600 mb-6">iPhoneの仕様やブラウザの制限により、自動でのファイル作成に失敗しました。<br>「設定」タブから手持でテキストをコピーして保存してください。</p>
                                <button onclick="App.closeModal('showBackupErrorModal')" class="w-full py-2.5 bg-gray-800 text-white font-bold rounded-lg hover:bg-gray-700">閉じる</button>
                            </div>
                        </div>
                    `;
                }

                if (s.preSaveModal) {
                    html += `
                        <div class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-[80] p-4 animate-fade-in">
                            <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl animate-zoom-in">
                                <h3 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">${App.getIconHTML('save', 24, 'text-indigo-600')} 履歴データの保存</h3>
                                <p class="text-sm text-gray-600 mb-4 font-bold">${escapeHTML(s.preSaveModal.label)}のデータとして以下を保存します。金額は自由に修正可能です。</p>
                                <div class="space-y-3 mb-6">
                                    <div><label class="text-xs font-bold text-gray-500 mb-1 block">総入金・収入 (自動計算済)</label><input type="number" id="pre-save-income" value="${s.preSaveModal.income||0}" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-300" /></div>
                                    <div><label class="text-xs font-bold text-gray-500 mb-1 block">発生総支払 (自動計算済)</label><input type="number" id="pre-save-payment" value="${s.preSaveModal.payment}" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-rose-300" /></div>
                                    <div><label class="text-xs font-bold text-gray-500 mb-1 block">月末残高 (現在の口座＋現金)</label><input type="number" id="pre-save-balance" value="${s.preSaveModal.balance}" class="w-full px-3 py-2 border border-emerald-300 bg-emerald-50 rounded-lg focus:ring-2 focus:ring-emerald-400 font-bold" /></div>
                                </div>
                                <div class="flex justify-end gap-2"><button onclick="App.closeModal('preSaveModal')" class="px-4 py-2 text-gray-600 font-bold hover:bg-gray-100 rounded-lg">キャンセル</button><button onclick="App.confirmSaveHistory()" class="px-6 py-2 bg-indigo-600 text-white font-bold hover:bg-indigo-700 rounded-lg shadow-md">保存を実行</button></div>
                            </div>
                        </div>
                    `;
                }

                if (s.showAutoSaveModal) {
                    html += `
                        <div class="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-[100] p-4 animate-fade-in">
                            <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl text-center animate-zoom-in">
                                <div class="mx-auto w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mb-4">${App.getIconHTML('check-circle-2', 32)}</div>
                                <h3 class="text-xl font-bold text-gray-800 mb-2">前月データの自動保存</h3><p class="text-sm text-gray-600 mb-6">月替わりを検知したため、前月の最終状態を推移グラフに自動保存し、変動費をリセットしました。<br><br>続いてファイルのバックアップを生成します。</p>
                                <button onclick="App.handleAutoSaveConfirm()" class="w-full py-2.5 bg-gray-800 text-white font-bold rounded-lg hover:bg-gray-700">確認してバックアップ</button>
                            </div>
                        </div>
                    `;
                }

                if (s.deleteTarget) {
                    html += `
                        <div class="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-[70] p-4 animate-fade-in">
                            <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl animate-zoom-in">
                                <div class="flex items-center gap-3 text-red-600 mb-4">${App.getIconHTML('alert-triangle', 28)}<h3 class="text-lg font-bold">削除の確認</h3></div>
                                <p class="text-gray-600 mb-6 leading-relaxed">「<span class="font-bold">${escapeHTML(s.deleteTarget.name)}</span>」を削除してもよろしいですか？</p>
                                <div class="flex justify-end gap-3"><button onclick="App.closeModal('deleteTarget')" class="px-4 py-2 hover:bg-gray-100 rounded-lg font-bold text-gray-600">キャンセル</button><button onclick="App.executeDelete()" class="px-4 py-2 bg-red-500 text-white font-bold rounded-lg">削除する</button></div>
                            </div>
                        </div>
                    `;
                }

                if (s.confirmImportData) {
                    html += `
                        <div class="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-[60] p-4 animate-fade-in">
                            <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl text-center animate-zoom-in">
                                <div class="flex justify-center mb-4 text-amber-500">${App.getIconHTML('alert-triangle', 32)}</div>
                                <h3 class="text-xl font-bold text-gray-800 mb-2">復元の確認</h3><p class="text-sm text-gray-600 mb-6">現在のデータはすべて上書きされます。よろしいですか？</p>
                                <div class="flex justify-center gap-3"><button onclick="App.closeModal('confirmImportData')" class="px-4 py-2 font-bold text-gray-600 hover:bg-gray-100 rounded-lg">キャンセル</button><button onclick="App.executeImport()" class="px-4 py-2 bg-emerald-600 text-white font-bold rounded-lg">復元を実行</button></div>
                            </div>
                        </div>
                    `;
                }

                if (s.showSuccessModal) {
                    html += `
                        <div class="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-[60] p-4 animate-fade-in">
                            <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl text-center animate-zoom-in">
                                <div class="mx-auto w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mb-4">${App.getIconHTML('check-circle-2', 32)}</div>
                                <h3 class="text-xl font-bold text-gray-800 mb-2">復元完了</h3><p class="text-gray-600 mb-6">データの復元が正常に完了しました。</p>
                                <button onclick="App.closeModal('showSuccessModal')" class="w-full py-2.5 bg-gray-800 text-white font-bold rounded-lg hover:bg-gray-700">閉じる</button>
                            </div>
                        </div>
                    `;
                }

                if (s.selectedAccountPopup !== null) {
                    const acc = s.accounts.find(a => a.id === s.selectedAccountPopup);
                    if (acc) {
                        const relPays = s.payments.filter(p => p.accountId === acc.id);
                        const activeOut = relPays.filter(p => !p.isDone).reduce((sum, p) => sum + App.calcAmount(p.amount), 0);
                        const expected = App.calcAmount(acc.amount) + (acc.isIncomingDone ? 0 : App.calcAmount(acc.incomingAmount)) - activeOut;
                        html += `
                            <div class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 p-4 animate-fade-in" onclick="App.closeModal('selectedAccountPopup')">
                                <div class="bg-white rounded-2xl w-full max-w-md shadow-2xl flex flex-col max-h-[85vh] animate-zoom-in" onclick="event.stopPropagation()">
                                    <div class="p-5 border-b border-gray-100 flex justify-between items-center bg-blue-50/50 rounded-t-2xl">
                                        <div><h3 class="text-xl font-bold text-gray-800">${escapeHTML(acc.name)}</h3><p class="text-sm text-gray-500 font-medium mt-1">現在残高: <span class="font-bold text-gray-800">${App.formatCurrency(acc.amount)}</span></p></div>
                                        <button onclick="App.closeModal('selectedAccountPopup')" class="p-2 text-gray-400 hover:bg-white rounded-full bg-gray-50">${App.getIconHTML('x', 24)}</button>
                                    </div>
                                    <div class="p-5 overflow-y-auto">
                                        <h4 class="text-sm font-bold text-gray-700 mb-3 flex items-center gap-2">${App.getIconHTML('arrow-up-from-line', 20, 'text-rose-500')} 引落予定の明細一覧</h4>
                        `;
                        if (relPays.length > 0) {
                            html += `<div class="space-y-2">`;
                            relPays.forEach(p => {
                                html += `
                                    <div class="flex justify-between items-center bg-white p-3 rounded-xl border border-gray-100 text-sm shadow-sm ${p.isDone ? 'opacity-40 bg-gray-50' : ''}">
                                        <div>
                                            <span class="font-bold block mb-1 ${p.isDone?'line-through':''}">${escapeHTML(p.name)}</span>
                                            <div class="flex gap-2 text-[10px]">${p.dueDate ? `<span class="bg-gray-50 border px-1.5 py-0.5 rounded text-gray-500 flex items-center gap-1">${App.getIconHTML('calendar', 12)}${p.dueDate}日引落</span>` : ''}${p.isDone ? `<span class="bg-rose-100 text-rose-700 font-bold px-1.5 py-0.5 rounded">済</span>` : ''}</div>
                                        </div>
                                        ${App.getDisplayAmountHTML(p.amount, "text-gray-800")}
                                    </div>
                                `;
                            });
                            html += `</div>`;
                        } else {
                            html += `<p class="py-8 text-center text-sm text-gray-500 border border-dashed rounded-xl">引落予定はありません</p>`;
                        }
                        html += `
                                    </div>
                                    <div class="p-5 border-t bg-gray-50 rounded-b-2xl">
                                        <div class="flex justify-between text-sm font-bold mb-2"><span class="text-gray-600">未済引落合計</span><span class="text-rose-600">-${App.formatCurrency(activeOut)}</span></div>
                                        <div class="flex justify-between pt-3 border-t border-gray-200"><span class="text-sm font-bold text-gray-600">引落後予想残高</span><span class="font-black text-xl ${expected < 0 ? 'text-red-600' : 'text-emerald-600'}">${App.formatCurrency(expected)}</span></div>
                                    </div>
                                </div>
                            </div>
                        `;
                    }
                }

                if (s.alertMessage) {
                    html += `
                        <div class="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-[110] p-4 animate-fade-in">
                            <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl text-center animate-zoom-in">
                                <div class="flex justify-center mb-4 text-indigo-500">${App.getIconHTML('info', 32)}</div>
                                <p class="text-sm text-gray-700 mb-6 whitespace-pre-wrap leading-relaxed">${escapeHTML(s.alertMessage)}</p>
                                <button onclick="App.closeModal('alertMessage')" class="w-full py-2.5 bg-indigo-600 text-white font-bold rounded-lg hover:bg-indigo-700">OK</button>
                            </div>
                        </div>
                    `;
                }

                if (s.confirmResetAllocations) {
                    html += `
                        <div class="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-[100] p-4 animate-fade-in">
                            <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl animate-zoom-in">
                                <div class="flex items-center gap-3 text-red-600 mb-4">${App.getIconHTML('alert-triangle', 28)}<h3 class="text-lg font-bold">リセットの確認</h3></div>
                                <p class="text-gray-600 mb-6 leading-relaxed">現在の割り振りをすべてリセットしますか？</p>
                                <div class="flex justify-end gap-3"><button onclick="App.closeModal('confirmResetAllocations')" class="px-4 py-2 hover:bg-gray-100 rounded-lg font-bold text-gray-600">キャンセル</button><button onclick="App.executeResetAllocations()" class="px-4 py-2 bg-red-500 text-white font-bold rounded-lg">リセットする</button></div>
                            </div>
                        </div>
                    `;
                }

                if (s.confirmManualReset) {
                    html += `
                        <div class="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-[100] p-4 animate-fade-in">
                            <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl animate-zoom-in">
                                <div class="flex items-center gap-3 text-red-600 mb-4">${App.getIconHTML('alert-triangle', 28)}<h3 class="text-lg font-bold">月替わりリセットの確認</h3></div>
                                <p class="text-gray-600 mb-6 leading-relaxed">すべての「済」を解除し、変動費の金額をリセットします。よろしいですか？</p>
                                <div class="flex justify-end gap-3"><button onclick="App.closeModal('confirmManualReset')" class="px-4 py-2 hover:bg-gray-100 rounded-lg font-bold text-gray-600">キャンセル</button><button onclick="App.executeManualReset()" class="px-4 py-2 bg-red-500 text-white font-bold rounded-lg">実行する</button></div>
                            </div>
                        </div>
                    `;
                }

                if (s.confirmDeleteSubItem) {
                    html += `
                        <div class="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-[100] p-4 animate-fade-in">
                            <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl animate-zoom-in">
                                <div class="flex items-center gap-3 text-red-600 mb-4">${App.getIconHTML('alert-triangle', 28)}<h3 class="text-lg font-bold">削除の確認</h3></div>
                                <p class="text-gray-600 mb-6 leading-relaxed">この内訳を削除しますか？</p>
                                <div class="flex justify-end gap-3"><button onclick="App.closeModal('confirmDeleteSubItem')" class="px-4 py-2 hover:bg-gray-100 rounded-lg font-bold text-gray-600">キャンセル</button><button onclick="App.executeDeleteSubItemConfirm()" class="px-4 py-2 bg-red-500 text-white font-bold rounded-lg">削除する</button></div>
                            </div>
                        </div>
                    `;
                }

                return html;
            },

            init: function() {
                App.loadData();
                const currentMonth = App.getCurrentMonthStr();
                const lastOpenedMonth = localStorage.getItem(STORAGE_KEY + 'last_opened_month');
                
                if (lastOpenedMonth && lastOpenedMonth !== currentMonth) {
                    App.calculateTotals();
                    const existingHistory = App.state.history;
                    if (!existingHistory.some(h => h.id === lastOpenedMonth)) {
                        const [y, m] = lastOpenedMonth.split('-');
                        const label = `${y.slice(2)}年${parseInt(m, 10)}月`;
                        const autoRecord = { 
                            id: lastOpenedMonth, 
                            label, 
                            payment: App.totals.totalPaymentsNum, 
                            balance: App.totals.calculatedEndBalance,
                            income: App.totals.totalIncomesList,
                            catTotals: App.totals.allCatTotals,
                            details: App.createHistoryDetails(),
                            incomeDetails: App.createIncomeDetails()
                        };
                        existingHistory.push(autoRecord);
                        existingHistory.sort((a, b) => a.id.localeCompare(b.id));
                        App.state.showAutoSaveModal = true;
                    }
                    App.executeMonthlyReset();
                    App.saveData();
                }
                localStorage.setItem(STORAGE_KEY + 'last_opened_month', currentMonth);
                App.render();
            }
        };

        window.App = App;
        document.addEventListener('DOMContentLoaded', () => { App.init(); });

    </script>
</body>
</html>
